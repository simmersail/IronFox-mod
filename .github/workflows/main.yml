name: IronFox Professional Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Архитектура (arm64 = v8a)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86_64
          - bundle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      - name: Host Cleanup and Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android-sdk /opt/ghc "/usr/local/share/boost" "$RUNNER_TOOL_CACHE"
          # СТЕРИЛИЗАЦИЯ РАННЕРА: сносим всё в рабочей папке, включая скрытый кэш Mozilla .*
          # Это гарантирует честный билд C++ движка с нуля без старых хвостов в external/gecko/obj/
          sudo rm -rf "${{ github.workspace }}/*" 2>/dev/null || true
          sudo rm -rf "${{ github.workspace }}/.*" 2>/dev/null || true
          
          sudo swapoff /swapfile || true
          sudo fallocate -l 16G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: 💾 Настройка кэша исходников и инструментов (Ускорение x10)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/external/
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/uv
          # Ключ кэша привязываем к версии релиза и файлу версий автора, 
          # чтобы кэш автоматически сбросился, если автор обновит компиляторы
          key: ironfox-sources-v154-${{ hashFiles('scripts/versions.sh') }}
          restore-keys: |
            ironfox-sources-v154-
            
      - name: Build in Container
        run: |
          # 1. Создаем файл скрипта.
          cat << 'EOF' > build_script.sh
          set -ex

          # ГЛОБАЛЬНОЕ ПЕРЕКЛЮЧЕНИЕ НА ОФИЦИАЛЬНЫЙ СТАБИЛЬНЫЙ РЕЛИЗ 154.0.1
          echo "Forcing global build mode to Official Release 154.0.1..."
          export MOZ_ANDROID_BUILD_RELEASE=1
          export MOZILLA_OFFICIAL=1
          export IRONFOX_BUILD_TYPE="release"
          export IRONFOX_VERSION="154.0.1"
          
          # Базовые заглушки окружения (вне рабочей директории git)
          mkdir -p /opt/IronFox/
          echo "dummy-keystore-content" > /opt/IronFox/ironfox-android-keystore.jks
          echo "disabled" > /opt/IronFox/ironfox-sb-gapi-key.txt
          
          git config --global --add safe.directory '*'
          chmod +x scripts/*.sh
          
          # Настройка Rust
          export HOME=/root
          if [ ! -f /root/.cargo/bin/cargo ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          export PATH="/root/.cargo/bin:$PATH"
          
          if [ ! -f /root/.cargo/bin/cbindgen ]; then
            cargo install cbindgen
          fi
          
          mkdir -p /opt/ironfox-tools/bin
          cp /root/.cargo/bin/cbindgen /opt/ironfox-tools/bin/cbindgen
          chmod +x /opt/ironfox-tools/bin/cbindgen
          export PATH="/opt/ironfox-tools/bin:$PATH"
          
          # Первичные заглушки для GeckoView
          echo 'echo "S3 Upload bypassed successfully."' > ./scripts/ci-upload-artifacts-if.sh
          chmod +x ./scripts/ci-upload-artifacts-if.sh
          echo 'echo "CI Prep bypassed successfully."' > ./scripts/ci-prep.sh
          chmod +x ./scripts/ci-prep.sh
          if [ -d "external/gecko" ]; then
            echo "Wiping out old unpacked external/gecko folder to guarantee clean patching..."
            sudo rm -rf external/gecko 2>/dev/null || rm -rf external/gecko
          fi
          echo "Preparing sources for architecture: $BUILD_ARCH"
          rm -rf /__w/IronFox-mod/IronFox-mod/external/uv
          yes | ./scripts/get_sources.sh
          
          echo "ac_add_options --without-google-safebrowsing-api-keyfile" > overrides.mozconfig
          
          echo 'Starting GeckoView build...'
          yes | ./scripts/ci-build.sh "$BUILD_ARCH" 'geckoview'
          
          echo 'Resetting modified codebase files...'
          # Полная очистка: удаляем всё, что не в гите, и сбрасываем измененные файлы
          git reset --hard HEAD
          
          # 2. ЖЕСТКО удаляем папки build и obj силами хоста!
          # Это мгновенно снимет все блокировки диска хостом Actions.
          # На втором круге скрипт автора развернет Python и pip идеально чисто с нуля.
          rm -rf build/
          rm -rf obj/
            
          # 3. Чистим остальной мелкий untracked мусор, сохраняя нашOutputs/ с фейковым архивом
          git clean -fd -e outputs/ -e artifacts/ -e overrides.mozconfig

          # 2. ЖЕСТКО СНОСИМ папку движка, так как yes | пропускает её из-за бага ввода!
          if [ -d "external/gecko" ]; then
            echo "CRITICAL OVR: Wiping external/gecko folder to force fresh download for Fenix..."
            rm -rf external/gecko
          fi

          
          # 🎯 2. ЧЕСТНАЯ ПОВТОРНАЯ НАСТРОЙКА PYTHON СРЕДСТВАМИ СИСТЕМЫ
          # Создаем базовую структуру pyenv через системный python3, 
          # чтобы get_androguard и get_pip автора сразу увидели валидную папку.
          echo "Re-initializing Python environment for Fenix step..."
          mkdir -p build/
          python3 -m venv build/pyenv
          
          echo "SUCCESS: Python environment re-initialized and synced with disk."
       
          # ПЕРЕСОЗДАНИЕ ВСЕХ ЗАГЛУШЕК ПОСЛЕ RESET
          echo 'Restoring stubs for Fenix build...'
          echo 'echo "S3 Upload bypassed successfully."' > ./scripts/ci-upload-artifacts-if.sh
          chmod +x ./scripts/ci-upload-artifacts-if.sh
          echo 'echo "CI Prep bypassed successfully."' > ./scripts/ci-prep.sh
          chmod +x ./scripts/ci-prep.sh
          # 4. 🎯 ЗАГЛУШКА-ПЕРЕХВАТЧИК ДЛЯ СКАЧИВАНИЯ ИЗ S3 (ПЕРЕПИСАНА ЧЕРЕЗ ECHO)
          # Переписываем логику в один файл построчно, чтобы не конфликтовать с внешним cat
          echo '#!/bin/bash' > ./scripts/ci-download-artifacts.sh
          echo 'echo "--- LOCAL ARTIFACT INTERCEPTOR ---"' >> ./scripts/ci-download-artifacts.sh
          echo 'echo "Intercepted download request for project: \$1, arch: \$2"' >> ./scripts/ci-download-artifacts.sh
          echo 'if [ -f "./outputs/aar/geckoview-arm64-v8a.zip" ]; then' >> ./scripts/ci-download-artifacts.sh
          echo '  echo "SUCCESS: Found locally compiled GeckoView zip archive."' >> ./scripts/ci-download-artifacts.sh
          echo '  echo "Bypassing remote S3 download. Tree state is ready for Gradle."' >> ./scripts/ci-download-artifacts.sh
          echo '  exit 0' >> ./scripts/ci-download-artifacts.sh
          echo 'else' >> ./scripts/ci-download-artifacts.sh
          echo '  echo "WARNING: Local geckoview-arm64-v8a.zip not found!"' >> ./scripts/ci-download-artifacts.sh
          echo '  mkdir -p ./outputs/aar/' >> ./scripts/ci-download-artifacts.sh
          echo '  exit 0' >> ./scripts/ci-download-artifacts.sh
          echo 'fi' >> ./scripts/ci-download-artifacts.sh
            
          chmod +x ./scripts/ci-download-artifacts.sh
            
          echo "ac_add_options --without-google-safebrowsing-api-keyfile" > overrides.mozconfig

          # 🔐 ГЕНЕРАЦИЯ СОБСТВЕННОГО КЛЮЧА ДЛЯ ПОДПИСИ APK
          echo "Generating temporary CI Keystore for APK signing..."

          # 🔥 ВОТ ЭТА СТРОКА ВСЁ ИСПРАВИТ: Сносим старую текстовую заглушку автора!
          sudo rm -f /opt/IronFox/ironfox-android-keystore.jks 2>/dev/null || rm -f /opt/IronFox/ironfox-android-keystore.jks

          # Создаем директорию для ключей
          sudo mkdir -p /opt/IronFox/ 2>/dev/null || mkdir -p /opt/IronFox/
          sudo chmod 777 /opt/IronFox/ 2>/dev/null || true

          # Записываем тестовый пароль в файл
          echo "my_ci_password_123" > /opt/IronFox/ironfox-android-keystore-pass.txt
          # 2. ДОБАВЛЯЕМ: Пароль от конкретного ключа внутри (Key Pass)
          echo "my_ci_password_123" > /opt/IronFox/ironfox-android-signing-key-pass.txt
          
          
          # Используем точный путь к найденному встроенному keytool
          EMBEDDED_KEYTOOL="/__w/IronFox-mod/IronFox-mod/external/jdk-21/bin/keytool"

          # Проверяем, что утилита физически существует по этому пути
          if [ ! -f "$EMBEDDED_KEYTOOL" ]; then
            echo "ERROR: Embedded keytool not found at $EMBEDDED_KEYTOOL! Stopping build."
            exit 1
          fi

          # Разрешаем запуск утилиты на исполнение
          chmod +x "$EMBEDDED_KEYTOOL"

          # Генерируем сам файл хранилища ключей .jks
          "$EMBEDDED_KEYTOOL" -genkey -v \
            -keystore /opt/IronFox/ironfox-android-keystore.jks \
            -alias ironfox \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass my_ci_password_123 \
            -keypass my_ci_password_123 \
            -dname "CN=IronFoxCI, OU=Dev, O=IronFox, L=Local, S=State, C=US"
            
          # Жестко перезаписываем файл в /opt/
          # sudo cp -f "$LOCAL_JKS" /opt/IronFox/ironfox-android-keystore.jks
          # echo "SUCCESS: Valid keystore created and injected!"
          
          # Финальная проверка создания файла ключа
          if [ ! -f "/opt/IronFox/ironfox-android-keystore.jks" ]; then
            echo "ERROR: Keystore file was not created at /opt/IronFox/! Stopping build."
            exit 1
          fi

          echo "SUCCESS: Keystore generated and verified using embedded JDK!"

          # =====================================================================
          # 🔗 ПОДГОТОВКА СЛИЯНИЯ: РАСПАКОВКА ДВИЖКА В MAVEN ДЛЯ FENIX
          # =====================================================================
          echo "Preparing local Maven repository..."
          
          # Ручная распаковка нужна СТРОГО для одиночных архитектур,
          # так как для bundle скрипты автора делают Fat AAR нативно через mach!
          if [ "$BUILD_ARCH" != "bundle" ]; then
            
            # Определяем точное имя файла в зависимости от одиночной архитектуры
            if [ "$BUILD_ARCH" == "arm64" ]; then
              REAL_ZIP="./outputs/aar/geckoview-arm64-v8a.zip"
            elif [ "$BUILD_ARCH" == "arm" ]; then
              REAL_ZIP="./outputs/aar/geckoview-armeabi-v7a.zip"
            else
              REAL_ZIP="./outputs/aar/geckoview-${BUILD_ARCH}.zip"
            fi

            echo "Target archive identified as: $REAL_ZIP"
            mkdir -p ./outputs/aar/maven/
            unzip -o "$REAL_ZIP" -d "./outputs/aar/maven/"
            echo "SUCCESS: Local Maven repository populated with custom GeckoView!"
          else
            echo "Mode is BUNDLE. Bypassing manual unzip, letting author's mach handle Fat AAR compilation."
          fi

          # Запускаем в режиме rebuild-fenix, чтобы скрипт взял наш готовый Maven-архив движка
          # =====================================================================
          # 🎯 ЭТАП 2: БЕЗОПАСНАЯ ИНЪЕКЦИЯ REBUILD-FENIX В ФИНАЛЬНЫЙ ШАГ
          # =====================================================================
          echo 'Injecting rebuild-fenix strictly into the final build.sh call...'
          
          # Находим уникальную строку вызова build.sh и меняем в ней переменную проекта на "rebuild-fenix"
          sed -i 's|/build.sh" "${IRONFOX_CI_BUILD_ARCH}" "${IRONFOX_CI_BUILD_PROJECT}"|/build.sh" "${IRONFOX_CI_BUILD_ARCH}" "rebuild-fenix"|g' ./scripts/ci-build.sh
          
          yes | ./scripts/ci-build.sh "$BUILD_ARCH" 'fenix'
          EOF

          # 2. Запуск Docker с передачей всех необходимых переменных
          docker run --rm -i \
            -u root \
            -v ${{ github.workspace }}:/__w/IronFox-mod/IronFox-mod \
            -w /__w/IronFox-mod/IronFox-mod \
            -e BUILD_ARCH="${{ github.event.inputs.arch }}" \
            -e IRONFOX_CI="1" \
            -e CI_PIPELINE_ID="github_action_build" \
            -e MOZ_BUILD_CONCURRENCY=1 \
            -e MOZ_LTO="full" \
            -e GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" \
            -e UV_LINK_MODE="copy" \
            -e CBINDGEN=/opt/ironfox-tools/bin/cbindgen \
            -e CI_COMMIT_REF_NAME="${{ github.ref_name }}" \
            -e IRONFOX_DEV_BRANCH="dev" \
            -e IRONFOX_PROD_BRANCH="main" \
            -e CI_PIPELINE_CREATED_AT="2026-09-01T00:00:00Z" \
            -e IRONFOX_LOG_SOURCES="1" \
            -e IRONFOX_CI_PREP_S3_ARTIFACTS="0" \
            -e IRONFOX_CI_PREP_S3_RELEASES="0" \
            -e IRONFOX_CI_PREP_ANDROID_KEYSTORE="0" \
            -e IRONFOX_SB_GAPI_KEY="null" \
            -e IRONFOX_SB_GAPI_KEY_FILE="null" \
            -e IRONFOX_ARTIFACTS_S3_ACCESS_KEY="dummy_key" \
            -e IRONFOX_ARTIFACTS_S3_SECRET_KEY="dummy_secret" \
            -e IRONFOX_ARTIFACTS_S3_BUCKET_NAME="dummy_bucket" \
            -e IRONFOX_ARTIFACTS_S3_ENDPOINT="dummy_endpoint" \
            -e IRONFOX_RELEASES_S3_ACCESS_KEY="dummy_key" \
            -e IRONFOX_RELEASES_S3_SECRET_KEY="dummy_secret" \
            -e IRONFOX_RELEASES_S3_BUCKET_NAME="dummy_bucket" \
            -e IRONFOX_RELEASES_S3_ENDPOINT="dummy_endpoint" \
            -e IRONFOX_ANDROID_KEYSTORE_URL="dummy" \
            -e IRONFOX_ANDROID_KEYSTORE_KEY_PASS="dummy_pass" \
            -e IRONFOX_ANDROID_KEYSTORE_STORE_PASS="dummy_pass" \
            -e IRONFOX_ANDROID_KEYSTORE_PASS="dummy_pass" \
            -e IRONFOX_ANDROID_KEYSTORE="/opt/IronFox/ironfox-android-keystore.jks" \
            registry.gitlab.com/ironfox-oss/ironfox:v154-0-1 \
            /bin/bash /__w/IronFox-mod/IronFox-mod/build_script.sh
            
      - name: Post-Failure Debugging
        if: failure()
        run: |
          echo "--- Host Swap Status ---"
          swapon --show
          echo "--- Host System Logs (dmesg) ---"
          sudo dmesg | tail -n 100
          
      - name: Fix Permissions for Artifact Upload
        run: sudo chown -R runner:docker ${{ github.workspace }}
        
      - name: Upload All IronFox Build Outputs
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-build-outputs
          # Указываем корень папки артефактов — экшен заберет всю структуру
          path: outputs/

         
