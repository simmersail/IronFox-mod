name: IronFox Professional Build
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Архитектура (arm64 = v8a)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86_64
          - bundle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      # STEP 1: Host Prep - 16GB Swap
      - name: Host Cleanup and Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android-sdk /opt/ghc "/usr/local/share/boost" "$RUNNER_TOOL_CACHE"
          sudo swapoff /swapfile || true
          sudo fallocate -l 16G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Triggered Batch Monitor
      # This stays silent until libxul.so is found, then sends 1 summary every 60 seconds.
      - name: Triggered Batch Monitor
        run: |
          MONITOR_URL="https://webhook.site/231e5035-86ed-4c3e-bcd3-0bbbce453bcf"
          LOG_FILE="build_output.log"
          
          nohup sh -c "
            echo 'Waiting for libxul.so linking phase...'
            until grep -q 'libxul.so' $LOG_FILE 2>/dev/null; do 
              sleep 15
            done
            
            echo 'CRITICAL PHASE DETECTED: Starting batch reporting...'
            while true; do 
              # Collect 6 snapshots (one every 10s) into a single package
              PACKAGE=\"\"
              for i in {1..6}; do
                TIMESTAMP=\$(date +%H:%M:%S)
                MEM=\$(free -m | grep Mem | awk '{print \"Used:\"\$3\"MB/Free:\"\$4\"MB\"}')
                SWAP=\$(free -m | grep Swap | awk '{print \"Used:\"\$3\"MB/Free:\"\$4\"MB\"}')
                PACKAGE=\"\$PACKAGE\n[\$TIMESTAMP] \$MEM | \$SWAP\"
                sleep 10
              done
              # Send the 1-minute package as a single request
              curl -s -X POST -d \"one_minute_package=\$PACKAGE\" $MONITOR_URL > /dev/null
            done
          " &
      - name: Fix Build Config
        run: |
          sed -i 's/IRONFOX_SB=1/IRONFOX_SB=thin/g' configs/mozconfigs/ironfox.mozconfig
          sed -i 's/MOZ_LTO=full/MOZ_LTO=0/g' configs/mozconfigs/ironfox.mozconfig
    
      # STEP 3: Build in Container with 'tee' for live logs + file
      - name: Build in Container
        run: |
          docker run --rm \
            -u root \
            -v ${{ github.workspace }}:/__w/IronFox-mod/IronFox-mod \
            -w /__w/IronFox-mod/IronFox-mod \
            -e IRONFOX_CI="1" \
            -e IRONFOX_SB="thin" \
            -e MOZ_BUILD_CONCURRENCY=1 \
            -e MOZ_LTO=0 \
            -e UV_LINK_MODE="copy" \
            -e CBINDGEN=/opt/ironfox-tools/bin/cbindgen \
            -e CI_COMMIT_REF_NAME="${{ github.ref_name }}" \
            -e IRONFOX_DEV_BRANCH="dev" \
            -e IRONFOX_PROD_BRANCH="main" \
            -e CI_PIPELINE_CREATED_AT="2026-09-01T00:00:00Z" \
            -e IRONFOX_LOG_SOURCES="1" \
            -e IRONFOX_CI_PREP_S3_ARTIFACTS="1" \
            -e IRONFOX_CI_PREP_S3_RELEASES="1" \
            -e IRONFOX_CI_PREP_SB_GAPI_KEY="1" \
            -e IRONFOX_CI_PREP_ANDROID_KEYSTORE="0" \
            -e IRONFOX_ARTIFACTS_S3_ACCESS_KEY="dummy_key" \
            -e IRONFOX_ARTIFACTS_S3_SECRET_KEY="dummy_secret" \
            -e IRONFOX_ARTIFACTS_S3_BUCKET_NAME="dummy_bucket" \
            -e IRONFOX_ARTIFACTS_S3_ENDPOINT="dummy_endpoint" \
            -e IRONFOX_ARTIFACTS_S3_ACCESS_KEY_FILE="/tmp/artifacts_access_key" \
            -e IRONFOX_ARTIFACTS_S3_BUCKET_NAME_FILE="/tmp/artifacts_bucket_name" \
            -e IRONFOX_ARTIFACTS_S3_ENDPOINT_FILE="/tmp/artifacts_endpoint" \
            -e IRONFOX_ARTIFACTS_S3_SECRET_KEY_FILE="/tmp/artifacts_secret_key" \
            -e IRONFOX_RELEASES_S3_ACCESS_KEY="dummy_key" \
            -e IRONFOX_RELEASES_S3_SECRET_KEY="dummy_secret" \
            -e IRONFOX_RELEASES_S3_BUCKET_NAME="dummy_bucket" \
            -e IRONFOX_RELEASES_S3_ENDPOINT="dummy_endpoint" \
            -e IRONFOX_RELEASES_S3_ACCESS_KEY_FILE="/tmp/releases_access_key" \
            -e IRONFOX_RELEASES_S3_BUCKET_NAME_FILE="/tmp/releases_bucket_name" \
            -e IRONFOX_RELEASES_S3_ENDPOINT_FILE="/tmp/releases_endpoint" \
            -e IRONFOX_RELEASES_S3_SECRET_KEY_FILE="/tmp/releases_secret_key" \
            -e IRONFOX_SB_GAPI_KEY="dummy_api_key" \
            -e IRONFOX_SB_GAPI_KEY_FILE="/tmp/sb_gapi_key" \
            registry.gitlab.com/ironfox-oss/ironfox:latest \
            /bin/bash -c "
              set -e
              git config --global --add safe.directory '*'
              chmod +x scripts/*.sh
              
              export HOME=/root
              if [ ! -f /root/.cargo/bin/cargo ]; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              fi
              export PATH=\"/root/.cargo/bin:\$PATH\"
              
              if [ ! -f /root/.cargo/bin/cbindgen ]; then
                cargo install cbindgen
              fi
              
              mkdir -p /opt/ironfox-tools/bin
              cp /root/.cargo/bin/cbindgen /opt/ironfox-tools/bin/cbindgen
              chmod +x /opt/ironfox-tools/bin/cbindgen
              
              echo 'export PATH=\"/opt/ironfox-tools/bin:\$PATH\"' >> /etc/profile
              export PATH=\"/opt/ironfox-tools/bin:\$PATH\"
              
              rm -rf /__w/IronFox-mod/IronFox-mod/external/uv
              yes | ./scripts/get_sources.sh

                            # --- INSERT FIX HERE ---
              echo 'Applying IRONFOX_SB fix to mozconfig...'
              sed -i 's/IRONFOX_SB=[01]/IRONFOX_SB=thin/g' configs/mozconfigs/ironfox.mozconfig
              sed -i 's/--with-ironfox-sb=[01]/--with-ironfox-sb=thin/g' configs/mozconfigs/ironfox.mozconfig
              # -----------------------
              
              echo 'Starting GeckoView build...'
              yes | ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'geckoview'
              
              echo 'Starting Fenix build...'
              yes | ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'fenix'
              
              echo 'Fixing permissions for artifact upload...'
              chown -R 1001:1001 /__w/IronFox-mod/IronFox-mod
            " | tee build_output.log

      # STEP 4: Debugging (Runs on host)
      - name: Post-Failure Debugging
        if: failure()
        run: |
          echo "--- Host Swap Status ---"
          swapon --show
          echo "--- Host Disk Analysis ---"
          df -h
          echo "--- Host System Logs (dmesg) ---"
          sudo dmesg | tail -n 100
          
      - name: Fix Permissions for Artifact Upload
        run: sudo chown -R runner:docker ${{ github.workspace }}
        
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IronFox-${{ github.event.inputs.arch }}
          path: "**/*.apk"
