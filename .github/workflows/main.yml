name: IronFox Professional Build
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Архитектура (arm64 = v8a)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86_64
          - bundle

jobs:
  build:
    runs-on: ubuntu-latest
    # Предотвращаем принудительное завершение долгого билда (6 часов)
    timeout-minutes: 360 
    container:
      image: registry.gitlab.com/ironfox-oss/ironfox:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swap (To prevent Out-of-Memory)
        run: |
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
        continue-on-error: true

      - name: Fix Git Ownership
        # Решает ошибку "detected dubious ownership"
        # Позволяет Git работать с папками, созданными другим пользователем
        run: git config --global --add safe.directory '*'

      - name: Set permissions
        run: chmod +x scripts/*.sh

      - name: Get sources
        run: ./scripts/get_sources.sh || true

      - name: Full CI Build (GeckoView + Fenix)
        # CI: "true" — решает ошибку "should only be called from CI!"
        # MOZ_BUILD_CONCURRENCY: 2 — предотвращает OOM (падение по памяти)
        env:
          CI: "true"
          MOZ_BUILD_CONCURRENCY: 2
        run: |
          ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'geckoview'
          ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'fenix'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IronFox-${{ github.event.inputs.arch }}
          # Рекурсивно ищет все APK в любых папках проекта
          path: "**/*.apk"
