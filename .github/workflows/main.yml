name: IronFox Professional Build
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Архитектура (arm64 = v8a)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86_64
          - bundle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    container:
      image: registry.gitlab.com/ironfox-oss/ironfox:latest
    
    # 1. Глобальный уровень (основной)
    env:
      IRONFOX_CI: "1"
      MOZ_BUILD_CONCURRENCY: 2
      # Добавляем переменные, которые требует setup_ci()
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      IRONFOX_DEV_BRANCH: "dev"    # Замените на ваше имя ветки разработки, если оно другое
      IRONFOX_PROD_BRANCH: "main"  # Замените на ваше имя основной ветки (main/master), если другое
            # Добавляем заглушку для даты создания пайплайна
      CI_PIPELINE_CREATED_AT: "2026-09-01T00:00:00Z" 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swap (To prevent Out-of-Memory)
        run: |
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
        continue-on-error: true

      - name: Fix Git Ownership
        run: git config --global --add safe.directory '*'

      - name: Set permissions
        run: chmod +x scripts/*.sh

      - name: Cache Dependencies and Build
        uses: actions/cache@v4
        with:
          path: |
            external/
            build/
            **/obj-
          key: ${{ runner.os }}-ironfox-full-cache-${{ github.event.inputs.arch }}
          restore-keys: |
            ${{ runner.os }}-ironfox-full-cache-

      - name: Get sources
        run: ./scripts/get_sources.sh || true

      - name: Full CI Build (GeckoView + Fenix)
        # 2. Уровень шага (дополнительная страховка)
        env:
          IRONFOX_CI: "1"
        run: |
          # 3. Защитный экспорт и отладка внутри контейнера
          echo "Verifying environment: IRONFOX_CI is '${IRONFOX_CI}'"
          export IRONFOX_CI=1
          
          ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'geckoview'
          ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'fenix'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IronFox-${{ github.event.inputs.arch }}
          path: "**/*.apk"
