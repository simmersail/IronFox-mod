name: IronFox Professional Build
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Архитектура (arm64 = v8a)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86_64
          - bundle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    container:
      image: registry.gitlab.com/ironfox-oss/ironfox:latest
      options: --user root
    
    env:
      IRONFOX_CI: "1"
      MOZ_BUILD_CONCURRENCY: 2
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      IRONFOX_DEV_BRANCH: "dev"
      IRONFOX_PROD_BRANCH: "main"
      CI_PIPELINE_CREATED_AT: "2026-09-01T00:00:00Z" 
      IRONFOX_LOG_SOURCES: "1"
      
      # Флаги управления (важно для логики if/elif в ci-build.sh)
      # Устанавливаем 1 для S3 Artifacts, чтобы скрипт зашел в prep_s3_artifacts
      IRONFOX_CI_PREP_S3_ARTIFACTS: "1"
      IRONFOX_CI_PREP_S3_RELEASES: "1"
      IRONFOX_CI_PREP_SB_GAPI_KEY: "1"
      IRONFOX_CI_PREP_ANDROID_KEYSTORE: "0"

      # Заглушки для S3 Artifacts
      IRONFOX_ARTIFACTS_S3_ACCESS_KEY: "dummy_key"
      IRONFOX_ARTIFACTS_S3_SECRET_KEY: "dummy_secret"
      IRONFOX_ARTIFACTS_S3_BUCKET_NAME: "dummy_bucket"
      IRONFOX_ARTIFACTS_S3_ENDPOINT: "dummy_endpoint"
      IRONFOX_ARTIFACTS_S3_ACCESS_KEY_FILE: "/tmp/artifacts_access_key"
      IRONFOX_ARTIFACTS_S3_BUCKET_NAME_FILE: "/tmp/artifacts_bucket_name"
      IRONFOX_ARTIFACTS_S3_ENDPOINT_FILE: "/tmp/artifacts_endpoint"
      IRONFOX_ARTIFACTS_S3_SECRET_KEY_FILE: "/tmp/artifacts_secret_key"

      # Заглушки для S3 Releases
      IRONFOX_RELEASES_S3_ACCESS_KEY: "dummy_key"
      IRONFOX_RELEASES_S3_SECRET_KEY: "dummy_secret"
      IRONFOX_RELEASES_S3_BUCKET_NAME: "dummy_bucket"
      IRONFOX_RELEASES_S3_ENDPOINT: "dummy_endpoint"
      IRONFOX_RELEASES_S3_ACCESS_KEY_FILE: "/tmp/releases_access_key"
      IRONFOX_RELEASES_S3_BUCKET_NAME_FILE: "/tmp/releases_bucket_name"
      IRONFOX_RELEASES_S3_ENDPOINT_FILE: "/tmp/releases_endpoint"
      IRONFOX_RELEASES_S3_SECRET_KEY_FILE: "/tmp/releases_secret_key"

      # Заглушка для Google Safe Browsing
      IRONFOX_SB_GAPI_KEY: "dummy_api_key"
      IRONFOX_SB_GAPI_KEY_FILE: "/tmp/sb_gapi_key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swap (To prevent Out-of-Memory)
        run: |
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
        continue-on-error: true

      - name: Fix Git Ownership
        run: git config --global --add safe.directory '*'

      - name: Set permissions
        run: chmod +x scripts/*.sh

      - name: Cache Dependencies and Build
        uses: actions/cache@v4
        with:
          path: |
            external/
            build/
            **/obj-
          key: ${{ runner.os }}-ironfox-full-cache-${{ github.event.inputs.arch }}
          restore-keys: |
            ${{ runner.os }}-ironfox-full-cache-

      - name: Get sources (force auto-confirm)
        run: |
          echo "Cleaning up uv directory..."
          rm -rf "${{ github.workspace }}/external/uv"
          echo "Running get_sources.sh with auto-confirmation..."
          yes | ./scripts/get_sources.sh || true

      - name: Full CI Build (GeckoView + Fenix)
        run: |
          # Определяем путь к локальному cargo из вашего лога
          export CARGO_BIN="${{ github.workspace }}/build/.cargo/bin"
          export PATH="$CARGO_BIN:$PATH"
          
          echo "Using cargo from $CARGO_BIN"
          
          # Проверяем, работает ли cargo теперь
          cargo --version
          
          # Устанавливаем cbindgen
          if ! command -v cbindgen &> /dev/null; then
            echo "cbindgen not found, installing..."
            cargo install cbindgen
          else
            echo "cbindgen already installed"
          fi

          # Запускаем билд
          yes | ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'geckoview'
          yes | ./scripts/ci-build.sh ${{ github.event.inputs.arch }} 'fenix'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IronFox-${{ github.event.inputs.arch }}
          path: "**/*.apk"
